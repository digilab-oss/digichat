# DIGILAB: build the patched Team-Edition image on an amd64 runner and push to the private
# GitLab registry. No end-to-end tests; we rely on upstream QA. (The inherited Mattermost
# e2e/CI workflows are gated on repository_owner == 'mattermost' and skip themselves in this
# fork; disable them in repo Settings → Actions if you want no noise.)
name: digichat-build

on:
  workflow_dispatch:               # manual: Actions → digichat-build → Run workflow
  push:
    branches: ['release-11.7-digilab']  # every push to our branch builds
    tags: ['v*-digilab*']               # or push a tag like v11.7.6-digilab.1

permissions:
  contents: read

concurrency:                       # one build per ref; cancel superseded runs
  group: digichat-build-${{ github.ref }}
  cancel-in-progress: true

# Required repo secrets (Settings → Secrets and variables → Actions):
#   GITLAB_REGISTRY_USER: GitLab deploy-token username (e.g. gitlab+deploy-token-NN)
#   GITLAB_REGISTRY_PASSWORD: that deploy token's value; scope write_registry (+read_registry)

env:
  IMAGE: registry.gitlab.com/digilab.overheid.nl/ecosystem/messaging/digichat

jobs:
  build:
    runs-on: ubuntu-24.04           # amd64 runner (no Rosetta or cross-build issues)
    steps:
      - uses: actions/checkout@v5    # the patched release-11.7-digilab branch
        with:
          fetch-depth: 50            # reach the upstream base commit for the provenance guard
      - uses: ./.github/actions/build-digichat
        with:
          image: ${{ env.IMAGE }}
          registry-user: ${{ secrets.GITLAB_REGISTRY_USER }}
          registry-token: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
